name: Amalan
description: Amalan (amalan International) is an Indonesian financial-services technology company headquartered
  in Jakarta and registered with Indonesia's Financial Services Authority (OJK). It helps distressed consumers
  and small-business owners restructure and refinance credit-card debt, personal loans (KTA), online loans
  (pinjol), and mortgages back toward creditworthiness. Its consumer platform provides a debt-relief negotiation
  program, amalanPROTECT protection against unethical debt collectors, Credit Score by amalan credit-score
  checks and history reports, and Credit Checkup loan-rejection consultation. Amalan is not a lender and does
  not take deposits or originate loans. It is backed by 500 Global. The company runs a consumer web app and
  marketing/blog site but publishes no public developer API, SDK, or developer portal.
